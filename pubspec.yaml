name: kibo_trade
description: Kibo Trade - inventory, POS and TRA VFD fiscalisation (offline-first).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.9
  intl: ^0.19.0
  http: ^1.2.1
  mobile_scanner: ^5.1.1
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4
  pdf: ^3.11.0
  printing: ^5.12.0
  share_plus: ^9.0.0
  file_picker: ^8.0.5
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  kibo_signer:        # generated by tool/prepare.sh (certificate signing, Android + iOS)
    path: packages/kibo_signer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
